<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: auto; }
        input[type="submit"] { padding: 10px 20px; background-color: #007BFF; border: none; color: white; cursor: pointer; }
        textarea { width: 100%; height: 150px; padding: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sentiment Analysis Web App</h2>
        <form method="post">
            <label for="review">Enter your review:</label><br>
            <textarea name="review" required></textarea><br>
            <input type="submit" value="Analyze Sentiment">
        </form>

        {% if sentiment %}
            <h3>Predicted Sentiment: {{ sentiment }}</h3>
            <p><strong>Preprocessed Text:</strong> {{ processed }}</p>
        {% endif %}
    </div>
</body>
</html>
